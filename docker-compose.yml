services:
  # Modèle local Gemma E4B
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Décommenter pour utiliser un GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Application : interface Streamlit + agents
  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e4b}
      STOCK_INITIAL: ${STOCK_INITIAL:-roue:3,batterie:2,chassis:1}
    depends_on:
      - ollama

volumes:
  ollama_data:
