<svg width="100%" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <style>
    .agent  { fill:#e8f0fe; stroke:#4285f4; stroke-width:1; }
    .mcp    { fill:#f1f3f4; stroke:#9aa0a6; stroke-width:1; }
    .tool   { fill:#e6f4ea; stroke:#34a853; stroke-width:1; }
    .io     { fill:#fff; stroke:#5f6368; stroke-width:1; }
    .state  { fill:#fef7e0; stroke:#f9ab00; stroke-width:1; }
    .th     { fill:#202124; font-size:14px; font-weight:600; }
    .ts     { fill:#3c4043; font-size:12px; }
    .lbl    { fill:#5f6368; font-size:11px; }
    line    { stroke:#5f6368; stroke-width:1.4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5f6368" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- IO -->
  <rect class="io" x="120" y="28" width="200" height="46" rx="8"/>
  <text class="th" x="220" y="46" text-anchor="middle">Commande</text>
  <text class="ts" x="220" y="63" text-anchor="middle">2 motos + 2 voitures</text>
  <rect class="io" x="360" y="28" width="200" height="46" rx="8"/>
  <text class="th" x="460" y="46" text-anchor="middle">Machines livrées</text>
  <text class="ts" x="460" y="63" text-anchor="middle">objets finis</text>
  <line x1="220" y1="74" x2="285" y2="92" marker-end="url(#a)"/>
  <line x1="430" y1="94" x2="460" y2="76" marker-end="url(#a)"/>

  <!-- CHEF -->
  <rect class="agent" x="40" y="94" width="600" height="190" rx="12"/>
  <text class="th" x="58" y="116">ORCHESTRATEUR · Chef d'usine  ↻</text>
  <rect class="mcp" x="60" y="134" width="560" height="130" rx="10"/>
  <text class="th" x="75" y="150" font-size="12">son MCP</text>
  <rect class="tool" x="72" y="162" width="265" height="28" rx="6"/><text class="ts" x="204" y="180" text-anchor="middle">lire_commande</text>
  <rect class="tool" x="352" y="162" width="265" height="28" rx="6"/><text class="ts" x="484" y="180" text-anchor="middle">suivi_commande</text>
  <rect class="tool" x="72" y="196" width="265" height="28" rx="6"/><text class="ts" x="204" y="214" text-anchor="middle">appeler_assembleur</text>
  <rect class="tool" x="352" y="196" width="265" height="28" rx="6"/><text class="ts" x="484" y="214" text-anchor="middle">appeler_fabricant</text>
  <rect class="tool" x="72" y="230" width="265" height="28" rx="6"/><text class="ts" x="204" y="248" text-anchor="middle">livrer_commande</text>

  <line x1="185" y1="284" x2="185" y2="322" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="176" y="298" text-anchor="end">1 / machine</text>
  <text class="lbl" x="176" y="312" text-anchor="end">↑ manquants (D)</text>
  <line x1="495" y1="284" x2="495" y2="322" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="504" y="298">↓ produire D</text>
  <text class="lbl" x="504" y="312">↑ en stock</text>

  <!-- ASSEMBLEUR -->
  <rect class="agent" x="40" y="324" width="290" height="196" rx="12"/>
  <text class="th" x="58" y="344">SOUS-AGENT · Assembleur</text>
  <text class="lbl" x="58" y="360">(sans mémoire)</text>
  <rect class="mcp" x="58" y="370" width="254" height="142" rx="10"/>
  <text class="th" x="73" y="384" font-size="12">son MCP</text>
  <rect class="tool" x="72" y="396" width="224" height="26" rx="6"/><text class="ts" x="184" y="413" text-anchor="middle">lire_recette</text>
  <rect class="tool" x="72" y="426" width="224" height="26" rx="6"/><text class="ts" x="184" y="443" text-anchor="middle">interroger_stock</text>
  <rect class="tool" x="72" y="456" width="224" height="26" rx="6"/><text class="ts" x="184" y="473" text-anchor="middle">assembler_vehicule</text>
  <rect class="tool" x="72" y="486" width="224" height="26" rx="6"/><text class="ts" x="184" y="503" text-anchor="middle">livrer_vehicule</text>

  <!-- FABRICANT -->
  <rect class="agent" x="350" y="324" width="290" height="174" rx="12"/>
  <text class="th" x="368" y="344">SOUS-AGENT · Fabricant  ↻</text>
  <text class="lbl" x="368" y="360">(mémoire de boucle : reçu vs cible D)</text>
  <rect class="mcp" x="368" y="372" width="254" height="120" rx="10"/>
  <text class="th" x="383" y="386" font-size="12">son MCP</text>
  <rect class="tool" x="382" y="398" width="224" height="26" rx="6"/><text class="ts" x="494" y="415" text-anchor="middle">rechercher_fournisseur</text>
  <rect class="tool" x="382" y="428" width="224" height="26" rx="6"/><text class="ts" x="494" y="445" text-anchor="middle">appeler_fournisseur</text>
  <rect class="tool" x="382" y="458" width="224" height="26" rx="6"/><text class="ts" x="494" y="475" text-anchor="middle">ajouter_au_stock</text>

  <line x1="495" y1="498" x2="495" y2="534" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="lbl" x="508" y="510">commander × n</text>
  <text class="lbl" x="508" y="524">↑ 1 à 5, jusqu'à ≥ D</text>

  <!-- FOURNISSEUR -->
  <rect class="agent" x="350" y="536" width="290" height="124" rx="12"/>
  <text class="th" x="368" y="556">SOUS-AGENT · Fournisseur</text>
  <text class="lbl" x="368" y="572">(sans mémoire)</text>
  <rect class="mcp" x="368" y="580" width="254" height="70" rx="10"/>
  <text class="th" x="383" y="594" font-size="12">son MCP</text>
  <rect class="tool" x="382" y="612" width="224" height="26" rx="6"/><text class="ts" x="494" y="629" text-anchor="middle">fournir_pieces → 1 à 5</text>

  <!-- ETAT PARTAGE -->
  <rect class="state" x="40" y="540" width="290" height="120" rx="12"/>
  <text class="th" x="58" y="560">ÉTAT PARTAGÉ</text>
  <text class="ts" x="58" y="582">stock : +Fabricant / −Assembleur</text>
  <text class="ts" x="58" y="602">suivi_commande : par le Chef</text>
  <text class="ts" x="58" y="622">la mémoire commune du système</text>
</svg>
