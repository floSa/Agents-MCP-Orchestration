[project]
name = "mcp-orchestration"
version = "0.1.0"
description = "Tutoriel d'orchestration multi-agents + MCP : une usine qui fabrique des machines."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Le code utilise le décorateur nu `@mcp.tool` et lit `CallToolResult.data` :
    # c'est l'API 3.x, pas celle de la 2.0 que le plancher laissait passer.
    "fastmcp>=3.4,<4",     # serveurs MCP (et client en mémoire)
    "streamlit>=1.60",     # interface de suivi
    "httpx>=0.28",         # appels HTTP vers Ollama
    "python-dotenv>=1.2",  # lecture du .env
]

[dependency-groups]
# Dépendances de confort pour le développement (facultatif)
dev = [
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usine"]
